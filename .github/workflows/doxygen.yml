name: Create Documentation
on:
  push:
    branches: ["main"]
    paths:
      - "btk/**"
      - "docs/**"

  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
        with:
          persist-credentials: false
      - name: Set up Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz build-essential 
      - name: Update doxygen-awesome
        run: git submodule update --init --recursive
      - name: Generate Docs
        run: cd docs && doxygen
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5
        id: deployment
        with:
          path: ./docs/html

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 #v5.1
        id: deployment
